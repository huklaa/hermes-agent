name: Apply #102371 branch fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'fix-102371-block-device-wipes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-102371-block-device-wipes
          fetch-depth: 0

      - name: Apply focused block-device wipe coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          approval = Path('tools/approval.py')
          text = approval.read_text()
          old = '''    (_CMDPOS + r'dd\\b[^\\n]*\\bof=/dev/(sd|nvme|hd|mmcblk|vd|xvd)[a-z0-9]*', "dd to raw block device"),\n'''
          new = old + '''    # Destructive block-device utilities take the target as a positional\n    # operand rather than dd's of= argument. Anchor the command word and\n    # require a raw block-device path so ordinary file shredding remains\n    # available (#102371).\n    (_CMDPOS + r'shred\\b[^\\n]*\\s+/dev/(sd|nvme|hd|mmcblk|vd|xvd)[a-z0-9]*\\b', "shred raw block device"),\n    (_CMDPOS + r'wipefs\\b[^\\n]*\\s+/dev/(sd|nvme|hd|mmcblk|vd|xvd)[a-z0-9]*\\b', "wipefs raw block device"),\n    (_CMDPOS + r'blkdiscard\\b[^\\n]*\\s+/dev/(sd|nvme|hd|mmcblk|vd|xvd)[a-z0-9]*\\b', "discard raw block device"),\n'''
          if old not in text:
              raise SystemExit('approval.py anchor not found')
          approval.write_text(text.replace(old, new, 1))

          tests = Path('tests/tools/test_hardline_blocklist.py')
          text = tests.read_text()
          old = '''    "dd if=anything of=/dev/hda",\n    "echo bad > /dev/sda",\n'''
          new = '''    "dd if=anything of=/dev/hda",\n    "shred -n1 -z /dev/sda",\n    "sudo shred -v /dev/nvme0n1",\n    "wipefs -a /dev/sdb",\n    "env FOO=1 wipefs --all /dev/mmcblk0",\n    "blkdiscard /dev/vda",\n    "nohup blkdiscard -f /dev/xvda",\n    "echo bad > /dev/sda",\n'''
          if old not in text:
              raise SystemExit('block test anchor not found')
          text = text.replace(old, new, 1)
          old = '''    "dd if=./data of=./backup.bin",\n    # Redirect to regular files / non-block devices\n'''
          new = '''    "dd if=./data of=./backup.bin",\n    "shred file.txt",\n    "shred -n1 -z ./scratch.img",\n    "wipefs --help",\n    "blkdiscard --help",\n    'echo "shred -n1 -z /dev/sda"',\n    'git commit -m "never run wipefs -a /dev/sda"',\n    # Redirect to regular files / non-block devices\n'''
          if old not in text:
              raise SystemExit('allow test anchor not found')
          tests.write_text(text.replace(old, new, 1))
          PY

      - name: Run focused tests
        run: python -m pytest tests/tools/test_hardline_blocklist.py -q

      - name: Commit and push fix branch
        run: |
          git config user.name "huklaa"
          git config user.email "129692708+huklaa@users.noreply.github.com"
          git add tools/approval.py tests/tools/test_hardline_blocklist.py
          git commit -m "fix(security): block destructive block-device utilities"
          git push origin HEAD:fix-102371-block-device-wipes
