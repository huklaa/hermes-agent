name: Cleanup PR 89893 branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-89893.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-89823-create-on-picker-clean
          fetch-depth: 0
      - name: Remove unrelated SDK hunk
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/desktop/src/sdk/index.ts')
          text = path.read_text()
          block = '''  /** Open a stored session that belongs to an agent on ANY registered source.
   *  The connection id + profile are the durable route; the store handles
   *  dialing / source activation, then the regular session-open path owns
   *  navigation + hydration. */
  openAgentSession: async (
    connectionId: null | string,
    profile: string,
    storedSessionId: string,
    options: Omit<PluginOpenSessionOptions, 'profile'> = {}
  ): Promise<void> => {
    await ensureGatewayAgent(connectionId, (profile ?? '').trim() || 'default')

    return host.openSession(storedSessionId, { ...options, profile })
  },

  /** Open a stored session — optionally pre-activating its profile first. */
'''
          if block not in text:
              raise SystemExit('expected unrelated openAgentSession block not found')
          text = text.replace(block, '', 1)
          path.write_text(text.rstrip('\n') + '\n')
      - name: Commit scoped cleanup
        run: |
          git config user.name "huklaa"
          git config user.email "129692708+huklaa@users.noreply.github.com"
          git add apps/desktop/src/sdk/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: keep #89893 SDK diff scoped"
          git push origin HEAD:fix-89823-create-on-picker-clean
