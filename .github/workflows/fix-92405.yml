name: Validate 92405 fix

on:
  push:
    branches:
      - fix-92405-single-query-allowlist
    paths:
      - .github/workflows/fix-92405.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-92405-single-query-allowlist
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install test dependencies
        run: uv sync --locked --python 3.11 --extra dev

      - name: Apply focused fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/approval.py')
          text = path.read_text()
          old = '''                is_dangerous, _pk, description = detect_dangerous_command(command)\n                if is_dangerous:\n                    return {\n'''
          new = '''                is_dangerous, _pk, description = detect_dangerous_command(command)\n                if is_dangerous and not is_approved(get_current_session_key(), _pk):\n                    return {\n'''
          if old not in text:
              raise SystemExit('single-query guard anchor not found')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/tools/test_single_query_allowlist_92405.py')
          test.write_text('''from tools import approval\nfrom tools import tirith_security\n\n\ndef _configure_single_query(monkeypatch, *, approved: bool) -> None:\n    monkeypatch.setattr(approval, "_YOLO_MODE_FROZEN", False)\n    monkeypatch.setattr(approval, "_should_skip_container_guards", lambda *args, **kwargs: False)\n    monkeypatch.setattr(approval, "detect_hardline_command", lambda _cmd: (False, None))\n    monkeypatch.setattr(approval, "_check_sudo_stdin_guard", lambda _cmd: (False, None))\n    monkeypatch.setattr(approval, "_match_user_deny_rule", lambda _cmd: None)\n    monkeypatch.setattr(approval, "_get_approval_mode", lambda: "smart")\n    monkeypatch.setattr(approval, "is_current_session_yolo_enabled", lambda: False)\n    monkeypatch.setattr(approval, "_command_matches_permanent_allowlist", lambda _cmd: False)\n    monkeypatch.setattr(approval, "_resolve_cli_approval_callback", lambda callback: callback)\n    monkeypatch.setattr(approval, "_is_interactive_cli", lambda: False)\n    monkeypatch.setattr(approval, "_is_gateway_approval_context", lambda: False)\n    monkeypatch.setattr(approval, "_is_single_query_approval_context", lambda: True)\n    monkeypatch.setattr(approval, "_get_single_query_approval_mode", lambda: "deny")\n    monkeypatch.setattr(approval, "_is_cron_approval_context", lambda: False)\n    monkeypatch.setattr(approval, "get_current_session_key", lambda: "sq-session")\n    monkeypatch.setattr(\n        approval,\n        "detect_dangerous_command",\n        lambda _cmd: (True, "script execution via heredoc", "script execution via heredoc"),\n    )\n    monkeypatch.setattr(\n        approval,\n        "is_approved",\n        lambda session_key, pattern_key: (\n            approved\n            and session_key == "sq-session"\n            and pattern_key == "script execution via heredoc"\n        ),\n    )\n    monkeypatch.setattr(tirith_security, "check_command_security", lambda _cmd: {"action": "allow"})\n\n\ndef test_single_query_deny_honors_pattern_allowlist(monkeypatch):\n    _configure_single_query(monkeypatch, approved=True)\n\n    result = approval.check_all_command_guards("python3 <<EOF\\nprint(1)\\nEOF", "local")\n\n    assert result == {"approved": True, "message": None}\n\n\ndef test_single_query_deny_still_blocks_unapproved_pattern(monkeypatch):\n    _configure_single_query(monkeypatch, approved=False)\n\n    result = approval.check_all_command_guards("python3 <<EOF\\nprint(1)\\nEOF", "local")\n\n    assert result["approved"] is False\n    assert result["pattern_key"] == "script execution via heredoc"\n    assert "single-query mode" in result["message"]\n''')
          PY
          git diff --check
          git diff -- tools/approval.py tests/tools/test_single_query_allowlist_92405.py

      - name: Run focused tests
        run: uv run python -m pytest tests/tools/test_single_query_allowlist_92405.py -q

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name huklaa
          git config user.email 129692708+huklaa@users.noreply.github.com
          git add tools/approval.py tests/tools/test_single_query_allowlist_92405.py
          git commit -m 'fix(approvals): honor allowlist in single-query deny mode'
          git push origin HEAD:fix-92405-single-query-allowlist
